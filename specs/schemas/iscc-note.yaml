$schema: "https://json-schema.org/draft/2020-12/schema"
title: "IsccNote"
type: object
description: |
  Signed declaration claim submitted by a declarer to an ISCC-HUB.

  See §5.1 of the IDP Declaration Profile.

  In v2 of the IDP Declaration Profile, `timestamp` is OPTIONAL. The Hub
  assigns its own microsecond-precision timestamp at sequencing time
  regardless of any declarer-supplied value. Timestamp handling is
  governed by configurable Hub policy (see the `timestamp` property).
required:
  - $schema
  - iscc_code
  - datahash
  - nonce
  - signature
additionalProperties: false
properties:
  $schema:
    type: string
    enum:
      - "http://purl.org/iscc/schema/iscc-note-0.8.0.json"
    description: |
      URI of the published IsccNote schema this declaration conforms to.

      A conforming declaration MUST validate against the published
      `iscc-note-0.8.0` schema; the Hub additionally enforces a stricter
      admission profile (see §5).
  iscc_code:
    $ref: "./common.yaml#/properties/iscc_code"
  datahash:
    $ref: "./common.yaml#/properties/blake3_multihash"
    description: |
      BLAKE3 multihash of the declared content bytes.
  nonce:
    $ref: "./common.yaml#/properties/nonce"
  signature:
    $ref: "./iscc-signature.yaml"
  timestamp:
    $ref: "./common.yaml#/properties/timestamp_ms"
    description: |
      OPTIONAL declarer-supplied timestamp.

      If absent, the Hub still produces a valid ISCC-ID and receipt. A Hub
      MAY require a declarer timestamp by policy (`REQUIRE_CLIENT_TIMESTAMP`)
      and MAY range-check a provided value against a configurable tolerance
      (`TIMESTAMP_TOLERANCE_SECONDS`, default ±600 s; 0 disables). When
      present, the value MUST use the strict RFC 3339 form with a `Z`
      suffix and exactly 3-digit milliseconds.
  gateway:
    $ref: "./common.yaml#/properties/gateway_uri"
  metahash:
    $ref: "./common.yaml#/properties/blake3_multihash"
    description: |
      OPTIONAL BLAKE3 multihash committing to metadata bytes.

      The metadata itself is not in signature scope; the metahash binds
      it cryptographically. See §13 (Metadata forwarding).
  units:
    type: array
    minItems: 1
    maxItems: 4
    description: |
      Extended similarity-preserving ISCC-UNITs of the declared
      ISCC-CODE. MUST NOT include the Instance-Code, which is derivable
      from `datahash`.
    items:
      $ref: "./common.yaml#/properties/iscc_unit"
examples:
  - $schema: "http://purl.org/iscc/schema/iscc-note-0.8.0.json"
    iscc_code: "ISCC:KACWN77F73NA44D6EUG3S3QNJIL2BPPQFMW6ZX6CZNOKPAK23S2IJ2I"
    datahash: "1e205ca7815adcb484e9a136c11efe69c1d530176d549b5d18d038eb5280b4b3470c"
    nonce: "00197932bfe2d31f11d8709be50f84bd"
    signature:
      version: "ISCC-SIG v1.0"
      pubkey: "z6MkmeDbeC5BecFmVnTHA5PWEBaVUrGLdB3weGE2KYnXfHso"
      proof: "znTcLukuu7CL8FpoaSxr6UWQpxCogZUCZ9iqx9dnP3inkzGszbUN79qrxWvpxEHnuNtLQ5Jd1rBukY7g1JSiYHVZ"
  - $schema: "http://purl.org/iscc/schema/iscc-note-0.8.0.json"
    iscc_code: "ISCC:KACWN77F73NA44D6EUG3S3QNJIL2BPPQFMW6ZX6CZNOKPAK23S2IJ2I"
    datahash: "1e205ca7815adcb484e9a136c11efe69c1d530176d549b5d18d038eb5280b4b3470c"
    metahash: "1e202335f74fc18e2f4f99f0ea6291de5803e579a2219e1b4a18004fc9890b94e598"
    nonce: "0013a3c214c05796673503e6e549446d"
    timestamp: "2026-05-21T10:42:00.000Z"
    gateway: "https://example.com/iscc_id/{iscc_id}"
    units:
      - "ISCC:AADWN77F73NA44D6X3N4VEUAPOW5HJKGK5JKLNGLNFPOESXWYDVDVUQ"
      - "ISCC:EADSKDNZNYGUUF5AMFEJLZ5P66CP5YKCOA3X7F36RWE4CIRCBTUWXYY"
    signature:
      version: "ISCC-SIG v1.0"
      controller: "did:web:example.com"
      pubkey: "z6MkmeDbeC5BecFmVnTHA5PWEBaVUrGLdB3weGE2KYnXfHso"
      proof: "z5j9nrpPw3oYSAN4XbCvk2sUtkwrueTD6V2Y35gS1KFTode2ED2YQWokPmoXw6QBYtYEFxtAQfzBhdNyr8PMwP79G"
