$schema: "https://json-schema.org/draft/2020-12/schema"
title: "IDP Common Properties"
type: object
description: |
  Shared field definitions referenced by IDP Declaration Profile schemas.

  Companion to §5 (Abstract Data Model) and §6 (JSON Representation) of the
  IDP Declaration Profile specification. These schemas document the
  plan-driven implementation; where they disagree with the running
  implementation, the implementation governs and the schema is corrected.
properties:
  iscc_code:
    type: string
    pattern: "^ISCC:[A-Z0-9]{29,68}$"
    minLength: 34
    maxLength: 73
    description: |
      Composite ISCC-CODE in standard string form.

      Format: `ISCC:` + uppercase Base32. Must be a composite code, not an
      individual ISCC-UNIT. 256-bit components are RECOMMENDED for pilot
      deployments to avoid birthday collisions.
    examples:
      - "ISCC:KACWN77F73NA44D6EUG3S3QNJIL2BPPQFMW6ZX6CZNOKPAK23S2IJ2I"
  iscc_id:
    type: string
    pattern: "^ISCC:[A-Z2-7]{16}$"
    minLength: 21
    maxLength: 21
    description: |
      ISCC-ID in standard string form.

      Encodes a 64-bit body: 52-bit microsecond timestamp + 12-bit hub_id.
      See §7 of the IDP Declaration Profile.
    examples:
      - "ISCC:MAEK2NC3Y5VZ4XQM"
  iscc_unit:
    type: string
    pattern: "^ISCC:[A-Z0-9]{16,68}$"
    minLength: 21
    maxLength: 73
    description: |
      Individual ISCC-UNIT in standard string form.

      Length: 21 characters (64-bit) or 60+ characters (256-bit).
    examples:
      - "ISCC:AADWN77F73NA44D6X3N4VEUAPOW5HJKGK5JKLNGLNFPOESXWYDVDVUQ"
  blake3_multihash:
    type: string
    pattern: "^1e20[0-9a-f]{64}$"
    minLength: 68
    maxLength: 68
    description: |
      BLAKE3 multihash, 256-bit digest.

      Format: literal `1e20` (multihash code 0x1e for BLAKE3, length 0x20)
      followed by 64 lowercase hex characters. 68 characters total.
    examples:
      - "1e205ca7815adcb484e9a136c11efe69c1d530176d549b5d18d038eb5280b4b3470c"
  nonce:
    type: string
    pattern: "^[0-9a-f]{32}$"
    minLength: 32
    maxLength: 32
    description: |
      128-bit replay-protection nonce.

      Format: 32 lowercase hex characters. The 12 most-significant bits
      (first 3 hex chars) MUST equal the target Hub's hub_id (0-4095).
      The remaining 116 bits MUST be generated from a cryptographically
      secure random source.
    examples:
      - "0013a3c214c05796673503e6e549446d"
  timestamp_ms:
    type: string
    format: date-time
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\\.[0-9]{3}Z$"
    description: |
      RFC 3339 UTC timestamp with strict millisecond precision.

      Format: `YYYY-MM-DDTHH:MM:SS.sssZ` — uppercase `Z` denotes UTC and
      exactly 3 fractional digits are required (a deliberate narrowing of
      the published pattern, which tolerates variable-length fractional
      seconds). On an IsccNote a declarer timestamp is OPTIONAL and its
      requirement is governed by Hub policy; on an IsccNoteDelete it is
      REQUIRED. A provided value MAY be range-checked against a configurable
      tolerance (default ±600 s).
    examples:
      - "2026-05-21T10:42:00.000Z"
  multibase_z:
    type: string
    pattern: "^z[1-9A-HJ-NP-Za-km-z]+$"
    description: |
      Multibase z-base58-btc encoded value.

      Used for Ed25519 public keys (with multicodec prefix 0xed01) and for
      Ed25519 signature values.
  gateway_uri:
    type: string
    minLength: 8
    maxLength: 2048
    pattern: "^https?://[^\\s]+$"
    description: |
      HTTPS URL or RFC 6570 URI template for Gateway resolution.

      Supported variables: `{iscc_id}`, `{iscc_code}`, `{datahash}`.
      Allowed operators: simple `{var}`, path-segment `{/var}`, label
      `{.var}`. Explode (`*`) and prefix (`:N`) modifiers are not
      permitted. No userinfo, query, or fragment components.

      Variables expand to lowercase values with no `ISCC:` prefix:
      the lowercase Base32 body (the `iscc:` URI form of ISO 24138)
      for `{iscc_id}` and `{iscc_code}`, the lowercase hex multihash
      for `{datahash}`.
    examples:
      - "https://example.com/iscc_id/{iscc_id}"
      - "https://registry.example.com/metadata"
