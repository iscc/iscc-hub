$schema: "https://json-schema.org/draft/2020-12/schema"
title: "IsccNoteDelete"
type: object
description: |
  Signed deletion request for a previously committed ISCC declaration.

  See §5.5 and §10 of the IDP Declaration Profile.

  Authorization: the signing key (`signature.pubkey`) MUST equal the
  signing key of the original IsccNote that produced `iscc_id`.
required:
  - $schema
  - iscc_id
  - nonce
  - signature
additionalProperties: false
properties:
  $schema:
    type: string
    enum:
      - "http://purl.org/iscc/schema/iscc-note-delete-0.8.0.json"
    description: |
      URI of the published IsccNoteDelete schema this deletion conforms to.
  iscc_id:
    $ref: "./common.yaml#/properties/iscc_id"
  timestamp:
    $ref: "./common.yaml#/properties/timestamp_ms"
    description: |
      Optional declarer-supplied timestamp of the deletion request. Governed by
      the same Hub policy as IsccNote: a Hub MAY require it
      (REQUIRE_CLIENT_TIMESTAMP) and MAY range-check a provided value
      (TIMESTAMP_TOLERANCE_SECONDS).
  nonce:
    $ref: "./common.yaml#/properties/nonce"
  signature:
    $ref: "./iscc-signature.yaml"
examples:
  - $schema: "http://purl.org/iscc/schema/iscc-note-delete-0.8.0.json"
    iscc_id: "ISCC:MAEK2NC3Y5VZ4XQM"
    timestamp: "2026-05-22T08:15:00.000Z"
    nonce: "001d17437f53f6899ed01ecb8659118b"
    signature:
      version: "ISCC-SIG v1.0"
      controller: "did:web:example.com"
      pubkey: "z6MkmeDbeC5BecFmVnTHA5PWEBaVUrGLdB3weGE2KYnXfHso"
      proof: "z5j9nrpPw3oYSAN4XbCvk2sUtkwrueTD6V2Y35gS1KFTode2ED2YQWokPmoXw6QBYtYEFxtAQfzBhdNyr8PMwP79G"
