name: Test

on:
  push:
    branches-ignore:
      - develop  # Tests for develop are handled by build workflow
  pull_request:
  workflow_call:  # Allow this workflow to be called by other workflows

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.13.7"

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --locked --all-extras --dev

    - name: Run complete CI pipeline
      run: uv run poe ci

  # Portability gate: run the full suite against PostgreSQL so the cross-backend
  # single-writer locking (select_for_update / FOR UPDATE on LogState) is exercised.
  # SQLite serializes writers via BEGIN IMMEDIATE and cannot prove the row lock.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iscc_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      UV_PYTHON: "3.14"
      ISCC_HUB_DB_ENGINE: postgres
      ISCC_HUB_DB_HOST: localhost
      ISCC_HUB_DB_PORT: "5432"
      ISCC_HUB_DB_USER: postgres
      ISCC_HUB_DB_PASSWORD: postgres
      ISCC_HUB_DB_NAME_PG: iscc_hub
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.13.7"

    - name: Set up Python
      run: uv python install 3.14

    - name: Install dependencies
      run: uv sync --locked --all-extras --dev

    - name: Run the suite against PostgreSQL
      run: uv run poe test-postgres
