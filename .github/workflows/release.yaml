name: Release

# Publish a versioned image when a v* tag is pushed. The tag must match the package version, the full
# test suite must pass, and the build pushes the image only after the smoke test of the built image passes.

on:
  push:
    tags:
      - 'v*'

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check that the tag matches the package version
        run: |
          # A release candidate tag (v0.1.1-rc.1) is allowed for the version it precedes
          PYPROJECT=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          PACKAGE=$(python3 -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('iscc_hub/__init__.py').read())[1])")
          echo "Tag: $GITHUB_REF_NAME, pyproject.toml: $PYPROJECT, iscc_hub/__init__.py: $PACKAGE"
          if [ "$PYPROJECT" != "$PACKAGE" ]; then
            echo "::error::pyproject.toml and iscc_hub/__init__.py must have the same version"
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$PYPROJECT" ] && ! [[ "$GITHUB_REF_NAME" =~ ^v${PYPROJECT//./\\.}-rc\.[0-9]+$ ]]; then
            echo "::error::The tag must be v$PYPROJECT or v$PYPROJECT-rc.N"
            exit 1
          fi

  test:
    needs: version
    uses: ./.github/workflows/test.yaml

  build:
    needs: test
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yaml
