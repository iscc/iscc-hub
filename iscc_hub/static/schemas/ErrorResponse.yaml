$schema: "https://json-schema.org/draft/2020-12/schema"
title: "ErrorResponse"
type: object
description: |
  Standard error response for ISCC-HUB API operations.

  The API follows a fail-fast approach: validation stops and returns immediately
  upon encountering the first error.
additionalProperties: false
required:
  - error
properties:
  error:
    type: object
    title: "ErrorDetail"
    additionalProperties: false
    required:
      - message
    properties:
      message:
        type: string
        description: |
          Human-readable error message describing the error encountered
      code:
        type: string
        description: |
          Machine-readable error code for programmatic handling.
          Common codes: invalid_iscc, timestamp_out_of_range, invalid_signature,
          duplicate_declaration, validation_failed, nonce_mismatch, invalid_length,
          invalid_format, invalid_hex, nonce_reuse, duplicate_datahash,
          did_required, did_unauthorized, did_unresolvable
      field:
        type: string
        description: |
          The specific field that caused the error (for validation errors).
          Only present when the error is associated with a specific input field.
      existing_iscc_id:
        type: string
        description: |
          ISCC-ID of the already-registered declaration.
          Only present on duplicate_declaration errors.
      existing_actor:
        type: string
        description: |
          Public key or DID of the actor that made the existing declaration.
          Only present on duplicate_declaration errors.
      resource_type:
        type: string
        description: |
          Type of the resource that was not found (e.g., declaration).
          Only present on not_found errors.
      resource_id:
        type: string
        description: |
          Identifier of the resource that was not found.
          Only present on not_found errors.
examples:
  - error:
      message: "Invalid ISCC code format"
      code: "invalid_iscc"
      field: "iscc_code"
  - error:
      message: "timestamp is outside ±600 second tolerance: 660.0 seconds"
      code: "timestamp_out_of_range"
      field: "timestamp"
  - error:
      message: "Invalid signature"
      code: "invalid_signature"
  - error:
      message: "Nonce already used: 000faa3f18c7b9407a48536a9b00c4cb"
      code: "nonce_reuse"
  - error:
      message: "Duplicate declaration for datahash: 1e205ca7815adcb484e9a136c11efe69c1d530176d549b5d18d038eb5280b4b3470c"
      code: "duplicate_declaration"
      field: "datahash"
      existing_iscc_id: "ISCC:MAAW63PEKDGZPG555XN4VEUAPOW5HJK"
      existing_actor: "z6MkhaXgBZDvotDkL5257faiztiGiC2QtKLGpbnnEGta2doK"
