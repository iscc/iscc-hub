$schema: "https://json-schema.org/draft/2020-12/schema"
title: "IsccReceipt"
type: object
description: |
  W3C Verifiable Credential for ISCC declaration

  Issued by the ISCC-HUB as proof of declaration with timestamp and sequence number.
additionalProperties: false
required:
  - '@context'
  - type
  - issuer
  - credentialSubject
  - proof
properties:
  '@context':
    type: array
    description: |
      JSON-LD context for the Verifiable Credential
    items:
      type: string
    minItems: 1
    example: ["https://www.w3.org/ns/credentials/v2"]
  type:
    type: array
    description: |
      Types of the credential

      Must include at least `VerifiableCredential` and `IsccReceipt`
    items:
      type: string
    minItems: 2
    example: ["VerifiableCredential", "IsccReceipt"]
  issuer:
    type: string
    format: uri
    description: |
      DID of the ISCC-HUB issuing this credential
    example: "did:web:hub.example.com"
  credentialSubject:
    type: object
    description: |
      Claims about the subject of the credential
    additionalProperties: false
    required:
      - id
      - declaration
    properties:
      id:
        type: string
        format: uri
        description: |
          DID of the subject (signer of the IsccNote)
        example: "did:key:z6MkhaXgBZDvotDkL5257faiztiGiC2QtKLGpbnnEGta2doK"
      declaration:
        type: object
        description: |
          Declaration details including sequence number and ISCC-ID
        additionalProperties: false
        required:
          - seq
          - iscc_id
          - iscc_note
        properties:
          seq:
            type: integer
            description: |
              Gapless sequence number in the event log

              **Start:** 0 (first declaration)
              **Guarantee:** No gaps in sequence
            minimum: 0
          iscc_id:
            $ref: "./CommonProperties.yaml#/properties/iscc_id"
          iscc_note:
            $ref: "./IsccNote.yaml"
  proof:
    type: object
    description: |
      W3C Data Integrity proof created by ISCC-HUB

      Uses **EdDSA-JCS-2022** cryptosuite with Ed25519 signatures.
      Contains copied @context from credential root per W3C spec.
    additionalProperties: false
    required:
      - '@context'
      - type
      - cryptosuite
      - verificationMethod
      - proofPurpose
      - proofValue
    properties:
      '@context':
        type: array
        description: |
          JSON-LD context copied from credential root (W3C spec requirement)
        items:
          type: string
        minItems: 1
        example: ["https://www.w3.org/ns/credentials/v2"]
      type:
        type: string
        const: "DataIntegrityProof"
      cryptosuite:
        type: string
        const: "eddsa-jcs-2022"
      verificationMethod:
        type: string
        format: uri
        description: |
          DID URL of the HUB's signing key
        example: "did:web:testserver#z6MkkRXoNEjqGNKHrPh8a54g6B2kqLp5M6HyA7odbCh1mDwX"
      proofPurpose:
        type: string
        const: "assertionMethod"
      proofValue:
        type: string
        description: |
          Multibase-encoded signature value

          **Format:** z-base58-btc encoding
        pattern: "^z[1-9A-HJ-NP-Za-km-z]+$"
  evidence:
    type: object
    description: |
      ISCC-Log inclusion proof binding the declaration to a signed checkpoint.

      Present once a published checkpoint covers the leaf. A verifier
      re-encodes the `{$schema, iscc_id, note}` log-entry envelope, computes its
      RFC 6962 leaf hash, combines it with `inclusionProof` to a root, and
      checks that root against the signed `checkpoint`.
    additionalProperties: false
    required:
      - type
      - checkpoint
      - treeSize
      - leafIndex
      - inclusionProof
    properties:
      type:
        type: string
        const: "IsccLogInclusionProof"
      checkpoint:
        type: string
        description: |
          The verbatim C2SP signed-note checkpoint covering the leaf.
      treeSize:
        type: integer
        minimum: 1
        description: |
          Tree size committed by the checkpoint.
      leafIndex:
        type: integer
        minimum: 0
        description: |
          Zero-based index of the declaration's leaf in the log.
      inclusionProof:
        type: array
        items:
          type: string
        description: |
          RFC 6962 inclusion proof: base64-encoded sibling hashes from the leaf
          to the tree head.
